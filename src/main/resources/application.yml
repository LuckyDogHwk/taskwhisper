spring:
  application:
    name: taskwhisper
  # JDK 21 虚拟线程（Spring Boot 4 显式开关）
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/taskwhisper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:taskwhisper}
    password: ${DB_PASSWORD:taskwhisper_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 项目自定义配置
taskwhisper:
  jwt:
    # 生产/演示环境务必通过环境变量覆盖（≥32 字节）
    secret: ${TASKWHISPER_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expire-hours: 24
  ai:
    # 不配置 Key 时 /api/tasks/nl 返回 503（诚实降级，无本地规则兜底）
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
